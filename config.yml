# AI-RSS-Client Configuration
# 墨水屏 RSS 阅读器配置文件

api:
  # AI-RSS-Hub API配置
  base_url: "http://8.134.202.27:8000"
  timeout: 10
  retry_attempts: 3
  retry_delay: 2
  # API Token (如果后端需要认证)
  api_token: null  # 或设置环境变量 AI_RSS_API_TOKEN

display:
  width: 240
  height: 360
  rotation: 0
  # 字体配置（树莓派常见字体）
  font_file: "/usr/share/fonts/truetype/wqy/wqy-microhei.ttc"
  font_file_fallback: "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

  # 字号配置（基于 240×360 屏幕）
  font_size_title: 18
  font_size_headline: 16
  font_size_summary: 15
  font_size_meta: 9

  # 布局配置
  line_spacing: 1
  margin: 6
  title_height: 35
  footer_height: 20

services:
  # 内容获取服务配置
  enabled: true
  interval_minutes: 20
  max_articles_per_fetch: 200  # 增加到200篇，确保获取3天内的所有文章
  daily_limit: 1000  # 增加每日限制
  fetch_days: 3  # 获取近3天的文章
  max_cached_articles: 1000  # 本地最多缓存1000篇文章
  incremental_fetch: false  # 是否启用增量获取（只获取新文章）
  fetch_feed_ids: []  # 指定要获取的RSS源ID列表（空=全部）

display_scheduler:
  # 显示调度服务配置
  enabled: true
  interval_minutes: 0.5  # 30秒切换一次
  min_display_interval: 30  # 最小显示间隔（秒）
  random_on_empty: true
  mark_as_read_after_display: false  # 改为false，支持循环播放
  display_days: 3  # 循环播放近3天的文章

logging:
  # 日志配置
  level: "INFO"
  logfile: "data/logs/service.log"
  max_log_size: 10485760  # 10MB
  backup_count: 5

network:
  # 网络请求配置
  timeout_seconds: 10
  retries: 3
  retry_delay: 5
